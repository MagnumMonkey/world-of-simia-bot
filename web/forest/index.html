<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WOS — Forest Home</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, Arial; }
    .scene {
        position: relative;
        height: 100%;
        overflow: hidden;
        }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;   /* ✅ disables scrollbars completely */
    }


    /* Adjust these 3 positions to match your image */
    #room1 { left: 20.8%; top: 72.7%; }
    #room2 { left: 45.1%; top: 43.7%; }
    #room3 { left: 80.1%; top: 74.7%; }


    /* overlay animation layer */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.45);
    }
    .overlay.show { display: grid; }

    .card {
      width: min(520px, 92vw);
      border-radius: 22px;
      background: rgba(10, 14, 22, 0.72);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 70px rgba(0,0,0,0.45);
      padding: 18px;
      color: #fff;
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .title { font-size: 18px; font-weight: 700; opacity: 0.95; }
    .close {
      cursor: pointer;
      border: 0;
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    /* simple “random animations” (placeholders) */
    .animBox {
        margin-top: 14px;
        width: 100%;
        aspect-ratio: 1 / 1;     /* ✅ square box */
        max-height: 70vh;        /* ✅ don’t exceed viewport */
        border-radius: 18px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        }

    .animBox img {
        width: 100%;
        height: 100%;
        object-fit: contain;   /* ✅ show whole gif, no cropping */
        border-radius: 14px;
        display: block;
        }

    /* fireflies */
    .firefly {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255, 240, 170, 0.95);
      filter: blur(0.3px);
      animation: drift 2.8s ease-in-out infinite;
      opacity: 0.0;
    }
    @keyframes drift {
      0% { transform: translate(0,0) scale(0.9); opacity: 0.0; }
      20% { opacity: 1.0; }
      50% { transform: translate(120px,-60px) scale(1.1); opacity: 0.9; }
      80% { opacity: 0.8; }
      100% { transform: translate(220px,-120px) scale(0.8); opacity: 0.0; }
    }

    /* sparkle burst */
    .spark {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(180, 220, 255, 0.95);
      animation: pop 900ms ease-out forwards;
    }
    @keyframes pop {
      0% { transform: translate(0,0) scale(0.6); opacity: 0.0; }
      20% { opacity: 1.0; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.0); opacity: 0.0; }
    }

    /* gentle glow pulse */
    .glow {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,160,0.55), rgba(255,220,160,0.0) 65%);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.65; }
      50% { transform: scale(1.08); opacity: 0.95; }
      100% { transform: scale(0.92); opacity: 0.65; }
    }

    .hint { margin-top: 10px; opacity: 0.75; font-size: 13px; }

    .particleOverlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;

        /* ✅ black background disappears, particles brighten */
        mix-blend-mode: screen;

        /* ✅ don’t block clicks */
        pointer-events: none;
        }

        .particleOverlay { z-index: 1; }
        .room { z-index: 2; }
        .overlay { z-index: 10; }

        .scene { perspective: 800px; }

        .bgLayer, .bgVideo, .particleOverlay, .room {
        will-change: transform;
        }

    /* Default (night) */

    .bgVideo{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    transform: translate(0px, 0px) scale(1.03);
    will-change: transform;
    display: none;
  }
    .bgLayer{
      position: absolute;
      inset: 0;
      background: url("./forest_bg.png") center/cover no-repeat;
      transform: translate(0px, 0px) scale(1.03);
      z-index: 0;
      will-change: transform;
    }

    /* Day theme */
    .scene.day .bgLayer{
      background-image: url("./forest_bg_day.png");
    }


        .bgLayer,
        .bgVideo,
        .particleOverlay {
            transition: transform 120ms ease-out;
        }

    .scene{
        transition: transform 240ms ease;
    }

    .scene.zoom{
        transform: scale(1.10);
    }
    
    @keyframes glowBreath {
      0%   { opacity: 0.85; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.85; }
  }

    .bgLayer {
      animation: glowBreath 8s ease-in-out infinite;
  }

  /* --- Intro overlay --- */
  .introOverlay{
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    z-index: 9; /* below the GIF modal (10), above rooms (2) */
    pointer-events: none; /* intro should not catch clicks */
  }

  /* --- Blur/unblur during intro --- */
  .scene.intro .bgLayer,
  .scene.intro .bgVideo,
  .scene.intro .particleOverlay{
    filter: blur(7px) brightness(0.92);
    transition: filter 900ms ease;
  }

/* lock rooms during intro */
  .scene.intro .room{
    pointer-events: none;
    opacity: 0.20;
    transition: opacity 500ms ease;
  }

  .introImage{
    max-width: 70%;
    max-height: 60%;
    object-fit: contain;

    opacity: 0;
    transition: opacity 1200ms ease;
  }

  /* visible state */
  .introOverlay.show .introImage{
    opacity: 1;
  }

  @keyframes titleGlow {
    0%   { filter: drop-shadow(0 0 6px rgba(255,220,160,0.6)); }
    50%  { filter: drop-shadow(0 0 16px rgba(255,220,160,0.9)); }
    100% { filter: drop-shadow(0 0 6px rgba(255,220,160,0.6)); }
  }

  .introOverlay.show .introImage{
    opacity: 1;
    animation: titleGlow 4s ease-in-out infinite;
  }

  .cornerTitle{
    position: absolute;
    top: 22px;
    right: 26px;   /* ✅ right side */
    left: auto;    /* ✅ ensure it’s not anchored left */

    z-index: 3;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 800ms ease, transform 800ms ease;

    pointer-events: none;
  }

  .cornerTitle.show{
    opacity: 0.90;
    transform: translateY(0px);
  }

  .cornerTitle img{
    height: clamp(100px, 10vw, 180px);   /* ✅ much bigger, responsive */
    max-width: 520px;
    object-fit: contain;
    filter: drop-shadow(0 8px 22px rgba(0,0,0,0.65));
  }

  /* --- Room Orbs --- */
  .room{
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 999px;
    cursor: pointer;

    /* orb look */
    background: radial-gradient(circle at 30% 30%,
      rgba(255,255,255,0.95),
      rgb(255, 255, 255) 35%,
      rgb(255, 255, 255) 55%,
      rgb(255, 255, 255) 75%
    );

    box-shadow:
      0 0 22px rgba(255,220,160,0.75),
      0 0 60px rgba(255,200,120,0.25);

    border: 1px solid rgba(255,255,255,0.25);

    /* keep your center-anchor positioning */
    transform: translate(-50%, -50%);
    transition: transform 140ms ease, box-shadow 140ms ease, opacity 300ms ease;

    z-index: 2;
    will-change: transform;
  }

  /* soft outer halo */
  .room::before{
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 999px;
    background: radial-gradient(circle,
      rgba(255,220,160,0.22),
      rgba(255,220,160,0.0) 70%
    );
    opacity: 0.9;
  }

  /* tiny sparkle core */
  .room::after{
    content: "";
    position: absolute;
    left: 18px;
    top: 14px;
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.95);
    filter: blur(0.2px);
    opacity: 0.9;
  }

  /* hover = brighter + slightly bigger */
  .room:hover{
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow:
      0 0 30px rgba(255,230,170,0.9),
      0 0 90px rgba(255,200,120,0.35);
  }

  /* idle floating animation */
  @keyframes orbFloat{
    0%   { transform: translate(-50%, -50%) translateY(0px); }
    50%  { transform: translate(-50%, -50%) translateY(-10px); }
    100% { transform: translate(-50%, -50%) translateY(0px); }
  }

  #room1{ animation: orbFloat 4.8s ease-in-out infinite; }
  #room2{ animation: orbFloat 5.4s ease-in-out infinite; }
  #room3{ animation: orbFloat 4.3s ease-in-out infinite; }

  img {
    -webkit-user-drag: none;  /* Chrome, Edge, Safari */
    user-select: none;       /* Prevent selection highlight */
  }

  img {
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none; /* iOS long-press menu */
  }

  body {
    position: fixed;
    inset: 0;
  }
  .zoneArrow{
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 8;

  width: 54px;
  height: 54px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;

  background: rgba(10,14,22,0.45);
  color: #fff;
  font-size: 28px;
  cursor: pointer;

  display: grid;
  place-items: center;

  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);

  transition: transform 140ms ease, background 140ms ease, opacity 180ms ease;
}

.zoneArrow:hover{
  background: rgba(255,255,255,0.12);
}

.zoneArrow.left{
  left: 18px;
}

.zoneArrow.right{
  right: 18px;
}

.zoneArrow.hidden{
  opacity: 0;
  pointer-events: none;
}

  </style>
</head>
<body>
  <div class="scene">
    <video class="bgVideo" id="bgVideo" autoplay muted loop playsinline></video>
    <div class="bgLayer"></div>
    <video class="particleOverlay" autoplay muted loop playsinline>
        <source src="./overlays/particles.mp4" type="video/mp4">
    </video>

    <div id="roomsContainer"></div>
    
    <button class="zoneArrow right" id="zoneNext" aria-label="Next zone">❯</button>
    <button class="zoneArrow left" id="zonePrev" aria-label="Previous zone">❮</button>

    <div class="cornerTitle" id="cornerTitle">
      <img src="./intro/title.png" alt="Nyhillia Forest">
    </div>


    <div class="introOverlay" id="introOverlay">
      <img class="introImage" src="./intro/title.png" alt="Nyhillia Forest">
    </div>


    <div class="overlay" id="overlay">
      <div class="card">
        <div class="row">
          <div class="title" id="animTitle">A room awakens…</div>
          <button class="close" id="closeBtn">Close</button>
        </div>
        <div class="animBox" id="animBox"></div>
        <div class="hint">Click another room for a different random animation.</div>
      </div>
    </div>
  </div>

  <script>

  const roomsContainer = document.getElementById("roomsContainer");
  const zoneNext = document.getElementById("zoneNext");
  const zonePrev = document.getElementById("zonePrev");

  let currentZone = 0;

  const ZONES = [
    {
      key: "forest_main",
      nightVideo: "./forest_bg.mp4",
      dayVideo: "./forest_bg_day.mp4",
      nightBg: "./forest_bg.mp4",
      dayBg: "./forest_bg_day.mp4",
      rooms: [
        { key: "room1", title: "The Private Canopy", left: "20.8%", top: "72.7%" },
        { key: "room2", title: "The Delightful Acacia", left: "45.1%", top: "43.7%" },
        { key: "room3", title: "Soft Touch Grove", left: "80.1%", top: "74.7%" }
      ]
    },
    {
      key: "forest_zone2",
      nightBg: "./spring_bg.png",
      dayBg: "./spring_bg_day.png",
      rooms: [
        { key: "zone2_room1", title: "Hot Spring Grove", left: "24%", top: "68%" },
        { key: "zone2_room2", title: "Firefly Pond", left: "54%", top: "46%" },
        { key: "zone2_room3", title: "Waterfall Spring", left: "79%", top: "70%" }
      ]
   }
  ]; 

  const overlay = document.getElementById("overlay");
  const closeBtn = document.getElementById("closeBtn");
  const animBox = document.getElementById("animBox");
  const animTitle = document.getElementById("animTitle");

  let GIFS = null;

  async function loadManifest() {
    const res = await fetch("./gifs/manifest.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Could not load manifest.json");
    GIFS = await res.json();
  }

  function getLocalDayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function hashStringToInt(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0);
  }

  function getThemeKey() {
  // use the scene class if present; fallback to clock
  if (scene.classList.contains("day")) return "day";
  if (scene.classList.contains("night")) return "night";
  return isDaytimeNow() ? "day" : "night";
}

  function getRoomList(roomKey) {
    const entry = GIFS?.[roomKey];

    // Backward compatible: old manifest format is an array
    if (Array.isArray(entry)) return entry;

    // New format: { day: [...], night: [...] }
    const theme = getThemeKey();
    const themed = entry?.[theme];
    return Array.isArray(themed) ? themed : [];
  }

  function pickDailyMedia(roomKey, list) {
    if (!Array.isArray(list) || list.length === 0) return null;

    // include theme so day and night can pick different “today” files
    const seed = `${getLocalDayKey()}:${roomKey}:${getThemeKey()}`;
    const idx = hashStringToInt(seed) % list.length;
    return list[idx];
  }

  function showGif(roomKey) {
    if (scene.classList.contains("intro")) return;

    const list = getRoomList(roomKey);
    const relPath = pickDailyMedia(roomKey, list);

    animBox.innerHTML = "";

    if (!relPath) {
      animTitle.textContent = GIFS ? "No animations configured for this theme yet." : "Loading…";
      animBox.textContent = GIFS ? "Add day/night paths to gifs/manifest.json" : "Please try again in a moment.";
      return;
    }

    // Open after we know we have something
    scene.classList.add("zoom");
    setTimeout(() => overlay.classList.add("show"), 140);

    const themeLabel = getThemeKey() === "day" ? "daylight" : "nightfall";
    animTitle.textContent = `Room ${roomKey.replace("room", "")} — ${themeLabel} animation`;

    // ✅ Use video for mp4/webm (faster than <img>)
    const video = document.createElement("video");
    video.src = `./gifs/${relPath}`;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";
    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "contain";
    video.style.borderRadius = "14px";

    animBox.appendChild(video);
    video.load();
    video.play().catch(() => {});
  }

  function renderZone() {
    const zone = ZONES[currentZone];
    roomsContainer.innerHTML = "";

    zone.rooms.forEach((room, index) => {
      const el = document.createElement("div");
      el.className = "room";
      el.id = room.key;
      el.title = room.title;
      el.style.left = room.left;
      el.style.top = room.top;

      el.style.animation = `orbFloat ${4.3 + index * 0.5}s ease-in-out infinite`;

      el.addEventListener("click", () => showGif(room.key));

      roomsContainer.appendChild(el);
    });

    updateZoneBackground();
    updateZoneArrows();
  }

  function updateZoneBackground() {
    const zone = ZONES[currentZone];
    const isDay = scene.classList.contains("day");

    const videoSrc = isDay ? zone.dayVideo : zone.nightVideo;
    const imageSrc = isDay ? zone.dayBg : zone.nightBg;

    if (videoSrc) {
      bg.style.display = "none";
      bgVideo.style.display = "block";

      const resolved = new URL(videoSrc, window.location.href).href;
      if (bgVideo.src !== resolved) {
        bgVideo.src = videoSrc;
        bgVideo.load();
        bgVideo.play().catch(() => {});
      }
    } else {
      bgVideo.pause();
      bgVideo.removeAttribute("src");
      bgVideo.load();
      bgVideo.style.display = "none";

      bg.style.display = "block";
      bg.style.backgroundImage = `url("${imageSrc}")`;
    }
  }

  function updateZoneArrows() {
    zonePrev.classList.toggle("hidden", currentZone === 0);
    zoneNext.classList.toggle("hidden", currentZone === ZONES.length - 1);
  }  


  closeBtn.addEventListener("click", () => {
    overlay.classList.remove("show");
    document.querySelector(".scene").classList.remove("zoom");
    });

  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) {
        overlay.classList.remove("show");
        document.querySelector(".scene").classList.remove("zoom");
    }
    });


  loadManifest().catch(err => {
    console.error(err);
    overlay.classList.add("show");
    animTitle.textContent = "Manifest load failed";
    animBox.textContent = "Could not load ./gifs/manifest.json (check path + hosting).";
  });



  // ---- Ambient parallax ----
    const scene = document.querySelector(".scene");
    const bg = document.querySelector(".bgLayer");
    const bgVideo = document.getElementById("bgVideo");
    const particles = document.querySelector(".particleOverlay");

    scene.addEventListener("mousemove", (e) => {
    const r = scene.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;   // -0.5 .. +0.5
    const y = (e.clientY - r.top) / r.height - 0.5;

    // background moves slower, particles a bit faster
    bg.style.transform = `translate(${x * 12}px, ${y * 12}px) scale(1.03)`;
    bgVideo.style.transform = `translate(${x * 12}px, ${y * 12}px) scale(1.03)`;
    particles.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
    });

    scene.addEventListener("mouseleave", () => {
      bg.style.transform = "translate(0px, 0px) scale(1.03)";
      bgVideo.style.transform = "translate(0px, 0px) scale(1.03)";
      particles.style.transform = "translate(0px, 0px)";
    });

    function isDaytimeNow() {
      const hour = new Date().getHours(); // user's local time
      return hour >= 7 && hour < 19;      // 7:00–18:59
    }

  // ---- Intro sequence ----
  const introOverlay = document.getElementById("introOverlay");

  // Start intro immediately
  scene.classList.add("intro");

  // Fade in title
  setTimeout(() => {
    introOverlay.classList.add("show");
  }, 200); // tiny delay so blur is visible first

  // Stay visible for 5 seconds, then fade out
  setTimeout(() => {
    introOverlay.classList.remove("show");
  }, 5200); // 200ms fade-in delay + 5s display

  // After fade-out finishes, unblur and unlock rooms
  setTimeout(() => {
    scene.classList.remove("intro");
  }, 6800); // allows fade-out animation to finish

  setTimeout(() => {
    document.getElementById("cornerTitle").classList.add("show");
  }, 6800);

  // Disable right-click context menu on the scene
  const sceneEl = document.querySelector(".scene");

  sceneEl.addEventListener("contextmenu", (e) => {
    e.preventDefault();
  });

  document.addEventListener("dragstart", (e) => {
    e.preventDefault();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "PrintScreen") {
      e.preventDefault();
      closeAnimation();
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) closeAnimation();
  });

  window.addEventListener("blur", () => closeAnimation());

  // ---- Day / Night background switch ----
  function applyDayNightTheme() {
    const hour = new Date().getHours();
    const isDay = hour >= 7 && hour < 19;

    scene.classList.toggle("day", isDay);
    scene.classList.toggle("night", !isDay);

    updateZoneBackground();
  }

  renderZone();
  applyDayNightTheme();
  setInterval(applyDayNightTheme, 5 * 60 * 1000);

  function closeAnimation() {
    overlay.classList.remove("show");
    scene.classList.remove("zoom");
    animBox.innerHTML = "";
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      closeAnimation();
    }
  });

  window.addEventListener("blur", () => {
    closeAnimation();
  });

  zoneNext.addEventListener("click", () => {
    if (currentZone < ZONES.length - 1) {
      currentZone++;
      renderZone();
    }
  });

  zonePrev.addEventListener("click", () => {
    if (currentZone > 0) {
      currentZone--;
      renderZone();
    }
  });

</script>
</body>
</html>
