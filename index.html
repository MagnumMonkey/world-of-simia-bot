<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WoS Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">

  <style>
    body { font-family: system-ui, Arial; margin: 0; padding: 16px; }

    header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }

    input { padding: 10px; width: 340px; max-width: 90vw; }

    button { padding: 10px 14px; cursor: pointer; }

    #status { margin: 12px 0; opacity: .8; }

    h1 {
        font-family: 'Luckiest Guy', cursive; /* or whatever font you chose */
        text-align: center;                  /* 👈 this is the key line */
        margin: 0 0 12px 0;
        }


    body {
        margin: 0;
        font-family: Arial, sans-serif;
        position: relative;
        min-height: 100vh;
        }

        /* Background image layer */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("static/backgrounds/wos_forest_frame.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        opacity: 1;           /* 👈 adjust this */
        z-index: -1;
        pointer-events: none;
        }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.35);
        z-index: -1;
        pointer-events: none;
        }


    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

    .card {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

    .card { cursor: pointer; }
    


    .img { width:100%; aspect-ratio: 2/3; background:#111; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#888; }

    .img img { width:100%; height:100%; object-fit:cover; display:block; }

    .name { font-weight:400; margin-top:8px; font-family: 'Baloo 2', sans-serif; text-align: center; }
    
    .meta { font-size:12px; opacity:.7; margin-top:2px; }

    /* Modal overlay */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

/* Modal container */
.modal {
  position: relative;
  background: #fff;
  border-radius: 16px;
  max-width: 580px;   /* BIGGER */
  width: 95%;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  animation: pop 0.2s ease-out;
}


/* Pop animation */
@keyframes pop {
  from {
    transform: scale(0.92);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Modal image */
.modal img {
  width: 100%;
  border-radius: 10px;
}

/* Meta text */
.modal-meta {
  margin-top: 12px;
  text-align: center;
}

.modal-name {
  font-weight: bold;
  font-size: 18px;
}

.modal-id {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 4px;
}

.modal-rarity {
  margin-top: 6px;
  font-size: 13px;
  font-weight: bold;
}

/* Close button */
.modal-close {
  position: absolute;
  top: 8px;
  right: 10px;
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
}

.modal-section {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.15);
}

.modal-label {
  font-weight: 700;
  opacity: 0.9;
  margin-bottom: 6px;
}

.modal-text {
  white-space: pre-line; /* allows \n to show as line breaks */
  opacity: 0.95;
  line-height: 1.35;
}




/* --- FINAL MODAL LAYOUT: SIDE PANEL VERSION --- */

.modal {
  display: flex;
  flex-direction: row;          /* side-by-side */
  align-items: center;
  gap: 40px;
  background: transparent;     /* no white background */
  box-shadow: none;
  padding: 32px 40px;
  width: min(1400px, 94vw);
  max-height: 92vh;
}

/* Card image */
#modalImg {
  width: min(500px, 42vw);     /* nice and big */
  max-height: 88vh;
  object-fit: contain;
  border-radius: 14px;
  flex: 0 0 auto;
}

/* Right-side text panel */
.modal-meta {
  flex: 1 1 auto;
  max-width: 1000px;
  color: #ffffff;
  text-align: center;         /* centered like your screenshot */
  padding-top: 8px;
}

/* Name */
.modal-name {
  color: #ffffff;
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 6px;
}

/* Rarity */
.modal-rarity {
  color: #cccccc;
  font-size: 18px;
  margin-bottom: 26px;
}

/* Section labels */
.modal-label {
  color: #ffffff;
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 10px;
  margin-top: 22px;
  text-align: center;
}

/* Ability / Skill text */
.modal-text {
  color: #f0f0f0;
  font-size: 18px;
  line-height: 1.7;
  text-align: center;
}

/* Darker overlay backdrop */
.modal-overlay {
  background: rgba(0, 0, 0, 0.88);
}

/* Close button */
.modal-close {
  color: #ffffff;
}

/* Responsive: stack on small screens */
@media (max-width: 900px) {
  .modal {
    flex-direction: column;
    align-items: center;
  }

  #modalImg {
    width: min(520px, 92vw);
  }

  .modal-meta {
    max-width: 92vw;
  }
}

/* Force two-column sizing */
.modal {
  display: flex;
  gap: 40px;
  width: min(1400px, 94vw);
}

/* Keep the card from hogging the whole modal */
#modalImg {
  width: min(520px, 46vw);
  flex: 0 0 auto;
}

/* Let the text panel actually grow */
.modal-meta {
  flex: 1 1 0;
  min-width: 360px;      /* important: forces it to claim space */
  max-width: none;       /* max-width was limiting you */
}

/* --- PROFILE HEADER --- */
.profile-card {
  display: none;
  max-width: 980px;
  margin: 16px auto 18px auto;
  padding: 18px;
  border-radius: 20px;
  color: #fff7df;
  background:
    linear-gradient(135deg, rgba(39, 20, 3, 0.92), rgba(105, 65, 11, 0.86)),

.profile-top {

.profile-eyebrow {

.profile-title {

}

.profile-user-id {

.profile-level {

.profile-stats {

.profile-stat {

}

.profile-stat-label {

}

.profile-stat-value {
  font-family: 'Baloo 2', sans-serif;

}

.profile-loading {

  font-weight: 700;

}

.filter-bar {

  display: flex;

  justify-content: center;

}

.filter-bar input,

}

.filter-bar input {
  width: 260px;
  max-width: 90vw;
}

  </style>
</head>
<body>
  <h1>The Naughty Playpen</h1>
    
  <header id="controls">
    <label>
      Discord User ID:
      <input id="uid" placeholder="1295073412980674682" />
    </label>
    <button id="loadBtn">Load</button>
  </header>

  <section id="profileCard" class="profile-card"></section>

  <div id="status"></div>

  <section id="filterBar" class="filter-bar" style="display:none;">
    <input id="searchInput" type="text" placeholder="Search cards..." />

    <select id="rarityFilter">
      <option value="">All Rarities</option>
      <option value="common">Common</option>
      <option value="uncommon">Uncommon</option>
      <option value="rare">Rare</option>
      <option value="legendary">Legendary</option>
    </select>

    <select id="tagFilter">
      <option value="">All Tags</option>
    </select>

    <select id="sortFilter">
      <option value="name">Name A-Z</option>
      <option value="rarity">Rarity</option>
      <option value="total">Total High to Low</option>
      <option value="banana">Banana Size High to Low</option>
      <option value="charm">Charm High to Low</option>
      <option value="mischief">Mischief High to Low</option>
    </select>

    <button id="clearFiltersBtn">Clear Filters</button>
  </section>

  <div id="grid" class="grid"></div>

  <!-- Modal -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Card details">
    <button id="modalClose" class="modal-close" aria-label="Close">✕</button>

    <img id="modalImg" alt="" />

    <div class="modal-meta">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-rarity" id="modalRarity"></div>

      <div class="modal-section">
        <div class="modal-label">Ability</div>
        <div class="modal-text" id="modalAbility"></div>
      </div>

      <div class="modal-section">
        <div class="modal-label">Skill</div>
        <div class="modal-text" id="modalSkills"></div>
      </div>
    </div>
  </div>
</div>





  <script>
    const API_BASE = "https://wos-api-production.up.railway.app";
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const uidEl = document.getElementById("uid");
    const profileCardEl = document.getElementById("profileCard");
    // Auto-load if URL is /collection/<user_id>
    const controlsEl = document.getElementById("controls");

    let currentPage = 1;
    const cardsPerPage = 18;

    let CARDS_DB = null;
    let ALL_COLLECTION_CARDS = [];
    let FILTERED_COLLECTION_CARDS = [];

    const pathMatch = window.location.pathname.match(/\/collection\/(\d+)\/?$/);

    // support BOTH ?user_id= (your Discord link) and ?u= (old)
    const params = new URLSearchParams(window.location.search);
    const urlUser = params.get("user_id") || params.get("u");
    const urlUsername = params.get("username") || params.get("name") || params.get("display_name") || "";

    const autoUserId = (pathMatch && pathMatch[1]) ? pathMatch[1] : (urlUser || null);


    // Modal elements
    const modalOverlay = document.getElementById("modalOverlay");
    const modalClose = document.getElementById("modalClose");
    const modalImg = document.getElementById("modalImg");
    const modalName = document.getElementById("modalName");
    const modalRarity = document.getElementById("modalRarity");
    const modalAbility = document.getElementById("modalAbility");
    const modalSkills  = document.getElementById("modalSkills");


    async function openModal({ name, cardId, imgUrl, rarity }) {
      modalName.textContent = name || "";
      modalRarity.textContent = rarity ? `Rarity: ${rarity}` : "";

      if (imgUrl) {
        modalImg.src = imgUrl;
        modalImg.style.display = "block";
      } else {
        modalImg.removeAttribute("src");
        modalImg.style.display = "none";
      }

      // Load abilities/skills from Cards.json by cardId
      try {
        const db = await loadCardsDbOnce();
        const card = db?.[cardId] || null;

        const ability = card?.ability;
        // Your Cards.json uses "skill" (singular) in many places
        const skill = card?.skill ?? card?.skills;

        modalAbility.textContent = (ability && String(ability).trim()) ? String(ability).trim() : "None";
        modalSkills.textContent  = (skill && String(skill).trim()) ? String(skill).trim() : "None";
      } catch (err) {
        modalAbility.textContent = "Could not load Cards.json";
        modalSkills.textContent = "";
        console.error(err);
      }

      modalOverlay.style.display = "flex";
      modalOverlay.setAttribute("aria-hidden", "false");
    }


    function closeModal() {
        modalOverlay.style.display = "none";
        modalOverlay.setAttribute("aria-hidden", "true");
    }

    // Close actions
    modalClose.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e) => {
    // Only close if they click the dark overlay, not the modal itself
        if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
    });


  async function loadCardsDbOnce() {
    if (CARDS_DB) return CARDS_DB;

    const res = await fetch("https://magnummonkey.github.io/world-of-simia-bot/Cards.json");
    if (!res.ok) throw new Error(`Failed to load Cards.json (${res.status})`);

    CARDS_DB = await res.json();
    return CARDS_DB;
  }

  function resolveImageUrl(url) {
    if (!url) return "";

    url = String(url).trim();

    if (url.startsWith("http://") || url.startsWith("https://")) {
      return url;
    }

    if (url.startsWith("/")) {
      return `https://magnummonkey.github.io/world-of-simia-bot${url}`;
    }

    return `https://magnummonkey.github.io/world-of-simia-bot/${url}`;
  }

  function getNumberField(card, ...keys) {
  for (const key of keys) {
    const value = card?.[key];
    const n = Number(value);
    if (Number.isFinite(n)) return n;
  }
  return 0;
}

function getCardTags(card) {
  const tags = new Set();

  const text = Object.values(card || {})
    .flatMap(value => Array.isArray(value) ? value : [value])
    .filter(value => value !== null && value !== undefined)
    .join(" ")
    .toLowerCase();

  if (card.rarity) tags.add(String(card.rarity).toLowerCase());

  if (card.personality) {
    String(card.personality)
      .toLowerCase()
      .split(/[,/]/)
      .map(p => p.trim())
      .filter(Boolean)
      .forEach(p => tags.add(p));
  }

  if (Array.isArray(card.statuses)) {
    card.statuses.forEach(status => tags.add(String(status).toLowerCase()));
  }

  if (card.status) {
    String(card.status)
      .toLowerCase()
      .split(/[,\s]+/)
      .map(s => s.trim())
      .filter(Boolean)
      .forEach(s => tags.add(s));
  }

  if (text.includes("lumari")) tags.add("lumari");
  if (text.includes("inkarri")) tags.add("inkarri");

  if (text.includes("baseline skill")) tags.add("baseline skill");
  if (text.includes("summon")) tags.add("summon");
  if (text.includes("resummon")) tags.add("resummon");
  if (text.includes("expel")) tags.add("expel");
  if (text.includes("send") && text.includes("home")) tags.add("send home");

  if (text.includes("wake-up")) tags.add("wake-up phase");
  if (text.includes("ready phase")) tags.add("ready phase");
  if (text.includes("playtime phase")) tags.add("playtime phase");
  if (text.includes("snooze phase")) tags.add("snooze phase");

  if (text.includes("banana size")) tags.add("banana size matters");
  if (text.includes("charm")) tags.add("charm matters");
  if (text.includes("mischief")) tags.add("mischief matters");
  if (text.includes("total")) tags.add("total matters");

  if (text.includes("grow") || text.includes("grows")) tags.add("stat grow");
  if (text.includes("shrink") || text.includes("shrinks")) tags.add("stat shrink");

  if (text.includes("heat")) tags.add("heat matters");
  if (text.includes("briefs")) tags.add("briefs matters");
  if (text.includes("erect")) tags.add("erect matters");
  if (text.includes("nude")) tags.add("nude matters");
  if (text.includes("ejaculating")) tags.add("ejaculating matters");

  if (text.includes("playtime points")) tags.add("point modifier");
  if (text.includes("additional playtime")) tags.add("extra playtime");
  if (text.includes("cannot be sent home")) tags.add("home protection");

  if (Array.isArray(card.tags)) {
    card.tags.forEach(tag => tags.add(String(tag).toLowerCase()));
  }

  return Array.from(tags).sort();
}

function buildSearchBlob(card) {
  return [
    card.name,
    card.card_id,
    card.rarity,
    card.personality,
    card.status,
    card.ability,
    card.skill,
    card.skills,
    card.flavor_text,
    card.tagsGenerated?.join(" ")
  ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
}

    function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function numberOrZero(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }

  function formatNumber(value) {
    return numberOrZero(value).toLocaleString();
  }

  async function loadProfile(userId) {
    if (!profileCardEl) return;

    profileCardEl.style.display = "block";
    profileCardEl.innerHTML = `<div class="profile-loading">Loading profile…</div>`;

    try {
      const url = `${API_BASE}/api/profile/${encodeURIComponent(userId)}`;
      console.log("Loading profile:", url);

      const res = await fetch(url);

      if (!res.ok) {
        const errText = await res.text();
        console.error("Profile API error:", res.status, errText);
        throw new Error(`Profile API returned ${res.status}`);
      }

      const profile = await res.json();
      renderProfile(profile);

    } catch (err) {
      console.error("Profile load failed:", err);
      profileCardEl.innerHTML = `
        <div class="profile-top">
          <div>
            <div class="profile-eyebrow">World of Simia Profile</div>
            <div class="profile-title">Profile unavailable</div>
            <div class="profile-user-id">The collection can still load below.</div>
          </div>
        </div>
      `;
    }
  }

  function renderProfile(profile) {
    if (!profileCardEl) return;

    const userId = profile?.user_id || uidEl.value.trim();

    const displayName =
      profile?.display_name ||
      profile?.username ||
      urlUsername ||
      "";

    const profileTitle = displayName
      ? displayName
      : "Player Profile";

    const level = numberOrZero(profile?.level) || 1;
    const xpInLevel = numberOrZero(profile?.xp_in_level ?? profile?.xp);
    const xpRequired = numberOrZero(profile?.xp_required) || 20;
    const xpRemaining = numberOrZero(profile?.xp_remaining);
    const bananaChips = numberOrZero(profile?.banana_chips);
    const cardsOwned = numberOrZero(profile?.cards_owned);
    const catalogSubmissions = numberOrZero(profile?.catalog_submissions);

    const xpPercent = xpRequired > 0
      ? Math.max(0, Math.min(100, Math.round((xpInLevel / xpRequired) * 100)))
      : 0;

    profileCardEl.innerHTML = `
      <div class="profile-top">
        <div>
          <div class="profile-eyebrow">World of Simia Profile</div>
          <div class="profile-title">${escapeHtml(profileTitle)}</div>
          <div class="profile-user-id">Discord ID: ${escapeHtml(userId)}</div>
        </div>

        <div class="profile-level">
          Level
          <span>${formatNumber(level)}</span>
        </div>
      </div>

      <div class="profile-xp-row">
        XP: <strong>${formatNumber(xpInLevel)}</strong> / ${formatNumber(xpRequired)}
        • ${formatNumber(xpRemaining)} XP to next level
      </div>

      <div class="profile-xpbar" aria-label="XP progress">
        <span style="width: ${xpPercent}%"></span>
      </div>

      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-label">Banana Chips</div>
          <div class="profile-stat-value">${formatNumber(bananaChips)} 🍌</div>
        </div>

        <div class="profile-stat">
          <div class="profile-stat-label">Cards Owned</div>
          <div class="profile-stat-value">${formatNumber(cardsOwned)}</div>
        </div>

        <div class="profile-stat">
          <div class="profile-stat-label">Catalog Submissions</div>
          <div class="profile-stat-value">${formatNumber(catalogSubmissions)}</div>
        </div>
      </div>
    `;
  }

  


    document.getElementById("loadBtn").addEventListener("click", () => loadCollection(1));

    document.getElementById("searchInput")?.addEventListener("input", () => applyFilters(1));
    document.getElementById("rarityFilter")?.addEventListener("change", () => applyFilters(1));
    document.getElementById("tagFilter")?.addEventListener("change", () => applyFilters(1));
    document.getElementById("sortFilter")?.addEventListener("change", () => applyFilters(1));

  document.getElementById("clearFiltersBtn")?.addEventListener("click", () => {
    document.getElementById("searchInput").value = "";
    document.getElementById("rarityFilter").value = "";
    document.getElementById("tagFilter").value = "";
    document.getElementById("sortFilter").value = "name";
    applyFilters(1);
  });


function buildTagDropdown() {
  const tagSelect = document.getElementById("tagFilter");
  if (!tagSelect) return;

  const currentValue = tagSelect.value;

  tagSelect.innerHTML = `<option value="">All Tags</option>`;

  const allTags = Array.from(
    new Set(ALL_COLLECTION_CARDS.flatMap(card => card.tagsGenerated || []))
  ).sort();

  allTags.forEach(tag => {
    const option = document.createElement("option");
    option.value = tag;
    option.textContent = tag;
    tagSelect.appendChild(option);
  });

  tagSelect.value = currentValue;
}

function applyFilters(page = 1) {
  const searchValue = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";
  const rarityValue = document.getElementById("rarityFilter")?.value || "";
  const tagValue = document.getElementById("tagFilter")?.value || "";
  const sortValue = document.getElementById("sortFilter")?.value || "name";

  FILTERED_COLLECTION_CARDS = ALL_COLLECTION_CARDS.filter(card => {
    const searchBlob = buildSearchBlob(card);

    const matchesSearch = !searchValue || searchBlob.includes(searchValue);
    const matchesRarity = !rarityValue || String(card.rarity || "").toLowerCase() === rarityValue;
    const matchesTag = !tagValue || (card.tagsGenerated || []).includes(tagValue);

    return matchesSearch && matchesRarity && matchesTag;
  });

  FILTERED_COLLECTION_CARDS.sort((a, b) => {
    if (sortValue === "total") {
      return getNumberField(b, "total", "Total") - getNumberField(a, "total", "Total");
    }

    if (sortValue === "banana") {
      return getNumberField(b, "banana_size", "bananaSize", "banana", "Banana Size") -
             getNumberField(a, "banana_size", "bananaSize", "banana", "Banana Size");
    }

    if (sortValue === "charm") {
      return getNumberField(b, "charm", "Charm") - getNumberField(a, "charm", "Charm");
    }

    if (sortValue === "mischief") {
      return getNumberField(b, "mischief", "Mischief") - getNumberField(a, "mischief", "Mischief");
    }

    if (sortValue === "rarity") {
      const rarityOrder = { legendary: 4, rare: 3, uncommon: 2, common: 1 };
      return (rarityOrder[String(b.rarity || "").toLowerCase()] || 0) -
             (rarityOrder[String(a.rarity || "").toLowerCase()] || 0);
    }

    return String(a.name || "").localeCompare(String(b.name || ""));
  });

  renderCollectionPage(page);
}



async function loadCollection(page = 1) {
  const userId = uidEl.value.trim();
  if (!userId) return;

  currentPage = Number(page) || 1;
  statusEl.textContent = "Loading…";
  gridEl.innerHTML = "";

  const filterBar = document.getElementById("filterBar");
  if (filterBar) filterBar.style.display = "none";

  loadProfile(userId);

  try {
    const cardsDb = await loadCardsDbOnce();

    const limit = cardsPerPage; // keep this at 18 because the API paginates correctly this way
    let apiPage = 1;
    let totalPages = 1;
    let rawCards = [];

    do {
      const url = `${API_BASE}/api/collection/${encodeURIComponent(userId)}?page=${apiPage}&limit=${limit}`;
      console.log("Loading collection page:", url);

      const res = await fetch(url);

      if (!res.ok) {
        const errText = await res.text();
        console.error("Collection API error:", res.status, errText);
        statusEl.textContent = `Could not load collection. API returned ${res.status}.`;
        return;
      }

      const col = await res.json();
      console.log("Collection API page payload:", col);

      rawCards = rawCards.concat(col.cards || []);
      totalPages = Number(col.total_pages || 1);

      apiPage += 1;
    } while (apiPage <= totalPages);

    ALL_COLLECTION_CARDS = rawCards
      .map((item, index) => {
        const cardId = typeof item === "string" ? item : item.card_id;
        if (!cardId) return null;

        const dbCard = cardsDb[cardId] || {};

        const fullCard = {
          ...dbCard,
          instance_id: `${cardId}-${index}`,
          card_id: cardId,
          name: dbCard.name || cardId,
          rarity: dbCard.rarity || "",
          image_url:
            dbCard.image_url_web ||
            dbCard.image_url ||
            dbCard.image_url_discord ||
            ""
        };

        fullCard.tagsGenerated = getCardTags(fullCard);

        return fullCard;
      })
      .filter(Boolean);

    if (!ALL_COLLECTION_CARDS.length) {
      statusEl.textContent = "No cards found for this user.";
      return;
    }

    buildTagDropdown();

    if (filterBar) filterBar.style.display = "flex";

    applyFilters(1);

  } catch (err) {
    console.error("Collection load failed:", err);
    statusEl.textContent = `Collection failed to load: ${err.message}`;
  }
}

function renderCollectionPage(page = 1) {
  currentPage = Number(page) || 1;
  gridEl.innerHTML = "";

  const totalCards = FILTERED_COLLECTION_CARDS.length;
  const totalPages = Math.max(1, Math.ceil(totalCards / cardsPerPage));

  if (currentPage > totalPages) currentPage = totalPages;

  const startIndex = (currentPage - 1) * cardsPerPage;
  const pageCards = FILTERED_COLLECTION_CARDS.slice(startIndex, startIndex + cardsPerPage);

  statusEl.textContent =
    `Showing ${pageCards.length ? startIndex + 1 : 0}-${Math.min(startIndex + pageCards.length, totalCards)} of ${totalCards} cards`;

  if (!pageCards.length) {
    gridEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;font-weight:700;">No cards match those filters.</div>`;
    return;
  }

  for (const c of pageCards) {
    const name = c.name || c.card_id;
    const imgUrl = resolveImageUrl(c.image_url);
    const rarity = c.rarity || "";

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="img">${imgUrl ? `<img src="${imgUrl}" alt="">` : "No image"}</div>
      <div class="name">${escapeHtml(name)}</div>
    `;

    div.addEventListener("click", () => {
      openModal({
        name,
        cardId: c.card_id,
        imgUrl,
        rarity
      });
    });

    gridEl.appendChild(div);
  }

  addPaginationControls(currentPage, totalPages);
}

function addPaginationControls(current, totalPages) {
  const paginationDiv = document.createElement("div");
  paginationDiv.style.marginTop = "20px";
  paginationDiv.style.textAlign = "center";
  paginationDiv.style.gridColumn = "1 / -1";

  const prevBtn = document.createElement("button");
  prevBtn.textContent = "← Previous";
  prevBtn.disabled = current <= 1;
  prevBtn.addEventListener("click", () => renderCollectionPage(current - 1));

  const pageText = document.createElement("span");
  pageText.textContent = ` Page ${current} of ${totalPages} `;
  pageText.style.margin = "0 10px";

  const nextBtn = document.createElement("button");
  nextBtn.textContent = "Next →";
  nextBtn.disabled = current >= totalPages;
  nextBtn.addEventListener("click", () => renderCollectionPage(current + 1));

  paginationDiv.appendChild(prevBtn);
  paginationDiv.appendChild(pageText);
  paginationDiv.appendChild(nextBtn);

  gridEl.appendChild(paginationDiv);
}

if (autoUserId) {
      uidEl.value = autoUserId;     // <-- this is the key (real value, not placeholder)
      loadCollection();

      // Hide input UI in shareable mode
      if (controlsEl) controlsEl.style.display = "none";
    }
  </script>
