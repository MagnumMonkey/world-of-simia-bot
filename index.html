<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WoS Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">

  <style>
    body { font-family: system-ui, Arial; margin: 0; padding: 16px; }

    header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }

    input { padding: 10px; width: 340px; max-width: 90vw; }

    button { padding: 10px 14px; cursor: pointer; }

    #status { margin: 12px 0; opacity: .8; }

    h1 {
        font-family: 'Luckiest Guy', cursive; /* or whatever font you chose */
        text-align: center;                  /* 👈 this is the key line */
        margin: 0 0 12px 0;
        }


    body {
        margin: 0;
        font-family: Arial, sans-serif;
        position: relative;
        min-height: 100vh;
        }

        /* Background image layer */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("static/backgrounds/wos_forest_frame.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        opacity: 1;           /* 👈 adjust this */
        z-index: -1;
        pointer-events: none;
        }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.35);
        z-index: -1;
        pointer-events: none;
        }


    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

    .card {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

    .card { cursor: pointer; }
    


    .img { width:100%; aspect-ratio: 2/3; background:#111; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#888; }

    .img img { width:100%; height:100%; object-fit:cover; display:block; }

    .name { font-weight:400; margin-top:8px; font-family: 'Baloo 2', sans-serif; text-align: center; }
    
    .meta { font-size:12px; opacity:.7; margin-top:2px; }

    /* Modal overlay */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

/* Modal container */
.modal {
  position: relative;
  background: #fff;
  border-radius: 16px;
  max-width: 580px;   /* BIGGER */
  width: 95%;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  animation: pop 0.2s ease-out;
}


/* Pop animation */
@keyframes pop {
  from {
    transform: scale(0.92);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Modal image */
.modal img {
  width: 100%;
  border-radius: 10px;
}

/* Meta text */
.modal-meta {
  margin-top: 12px;
  text-align: center;
}

.modal-name {
  font-weight: bold;
  font-size: 18px;
}

.modal-id {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 4px;
}

.modal-rarity {
  margin-top: 6px;
  font-size: 13px;
  font-weight: bold;
}

/* Close button */
.modal-close {
  position: absolute;
  top: 8px;
  right: 10px;
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
}

.modal-section {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.15);
}

.modal-label {
  font-weight: 700;
  opacity: 0.9;
  margin-bottom: 6px;
}

.modal-text {
  white-space: pre-line; /* allows \n to show as line breaks */
  opacity: 0.95;
  line-height: 1.35;
}




/* --- FINAL MODAL LAYOUT: SIDE PANEL VERSION --- */

.modal {
  display: flex;
  flex-direction: row;          /* side-by-side */
  align-items: center;
  gap: 40px;
  background: transparent;     /* no white background */
  box-shadow: none;
  padding: 32px 40px;
  width: min(1400px, 94vw);
  max-height: 92vh;
}

/* Card image */
#modalImg {
  width: min(500px, 42vw);     /* nice and big */
  max-height: 88vh;
  object-fit: contain;
  border-radius: 14px;
  flex: 0 0 auto;
}

/* Right-side text panel */
.modal-meta {
  flex: 1 1 auto;
  max-width: 1000px;
  color: #ffffff;
  text-align: center;         /* centered like your screenshot */
  padding-top: 8px;
}

/* Name */
.modal-name {
  color: #ffffff;
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 6px;
}

/* Rarity */
.modal-rarity {
  color: #cccccc;
  font-size: 18px;
  margin-bottom: 26px;
}

/* Section labels */
.modal-label {
  color: #ffffff;
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 10px;
  margin-top: 22px;
  text-align: center;
}

/* Ability / Skill text */
.modal-text {
  color: #f0f0f0;
  font-size: 18px;
  line-height: 1.7;
  text-align: center;
}

/* Darker overlay backdrop */
.modal-overlay {
  background: rgba(0, 0, 0, 0.88);
}

/* Close button */
.modal-close {
  color: #ffffff;
}

/* Responsive: stack on small screens */
@media (max-width: 900px) {
  .modal {
    flex-direction: column;
    align-items: center;
  }

  #modalImg {
    width: min(520px, 92vw);
  }

  .modal-meta {
    max-width: 92vw;
  }
}

/* Force two-column sizing */
.modal {
  display: flex;
  gap: 40px;
  width: min(1400px, 94vw);
}

/* Keep the card from hogging the whole modal */
#modalImg {
  width: min(520px, 46vw);
  flex: 0 0 auto;
}

/* Let the text panel actually grow */
.modal-meta {
  flex: 1 1 0;
  min-width: 360px;      /* important: forces it to claim space */
  max-width: none;       /* max-width was limiting you */
}



  </style>
</head>
<body>
  <h1>The Naughty Playpen</h1>
    
  <header id="controls">
    <label>
      Discord User ID:
      <input id="uid" placeholder="1295073412980674682" />
    </label>
    <button id="loadBtn">Load</button>
  </header>

  <div id="status"></div>
  <div id="grid" class="grid"></div>

  <!-- Modal -->
<div id="modalOverlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Card details">
    <button id="modalClose" class="modal-close" aria-label="Close">✕</button>

    <img id="modalImg" alt="" />

    <div class="modal-meta">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-rarity" id="modalRarity"></div>

      <div class="modal-section">
        <div class="modal-label">Ability</div>
        <div class="modal-text" id="modalAbility"></div>
      </div>

      <div class="modal-section">
        <div class="modal-label">Skill</div>
        <div class="modal-text" id="modalSkills"></div>
      </div>
    </div>
  </div>
</div>





  <script>
    const API_BASE = "https://wos-api-production.up.railway.app";
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const uidEl = document.getElementById("uid");
    // Auto-load if URL is /collection/<user_id>
    const controlsEl = document.getElementById("controls");

    let currentPage = 1;
    const cardsPerPage = 18;

    const pathMatch = window.location.pathname.match(/^\/collection\/(\d+)\/?$/);

    // support BOTH ?user_id= (your Discord link) and ?u= (old)
    const params = new URLSearchParams(window.location.search);
    const urlUser = params.get("user_id") || params.get("u");

    const autoUserId = (pathMatch && pathMatch[1]) ? pathMatch[1] : (urlUser || null);

    if (autoUserId) {
      uidEl.value = autoUserId;     // <-- this is the key (real value, not placeholder)
      loadCollection();

      // Hide input UI in shareable mode
      if (controlsEl) controlsEl.style.display = "none";
    }


    // Modal elements
    const modalOverlay = document.getElementById("modalOverlay");
    const modalClose = document.getElementById("modalClose");
    const modalImg = document.getElementById("modalImg");
    const modalName = document.getElementById("modalName");
    const modalRarity = document.getElementById("modalRarity");
    const modalAbility = document.getElementById("modalAbility");
    const modalSkills  = document.getElementById("modalSkills");


    async function openModal({ name, cardId, imgUrl, rarity }) {
      modalName.textContent = name || "";
      modalRarity.textContent = rarity ? `Rarity: ${rarity}` : "";

      if (imgUrl) {
        modalImg.src = imgUrl;
        modalImg.style.display = "block";
      } else {
        modalImg.removeAttribute("src");
        modalImg.style.display = "none";
      }

      // Load abilities/skills from Cards.json by cardId
      try {
        const db = await loadCardsDbOnce();
        const card = db?.[cardId] || null;

        const ability = card?.ability;
        // Your Cards.json uses "skill" (singular) in many places
        const skill = card?.skill ?? card?.skills;

        modalAbility.textContent = (ability && String(ability).trim()) ? String(ability).trim() : "None";
        modalSkills.textContent  = (skill && String(skill).trim()) ? String(skill).trim() : "None";
      } catch (err) {
        modalAbility.textContent = "Could not load Cards.json";
        modalSkills.textContent = "";
        console.error(err);
      }

      modalOverlay.style.display = "flex";
      modalOverlay.setAttribute("aria-hidden", "false");
    }


    function closeModal() {
        modalOverlay.style.display = "none";
        modalOverlay.setAttribute("aria-hidden", "true");
    }

    // Close actions
    modalClose.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e) => {
    // Only close if they click the dark overlay, not the modal itself
        if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
    });

  let CARDS_DB = null;

  async function loadCardsDbOnce() {
    if (CARDS_DB) return CARDS_DB;

    // On GitHub Pages this must match the exact filename/case: "Cards.json"
    const res = await fetch("Cards.json");
    if (!res.ok) throw new Error(`Failed to load Cards.json (${res.status})`);

    CARDS_DB = await res.json();
    return CARDS_DB;
  }




    document.getElementById("loadBtn").addEventListener("click", loadCollection);

    async function loadCollection(page = 1) {
      const userId = uidEl.value.trim();
      if (!userId) return;

      currentPage = page;
      statusEl.textContent = "Loading…";
      gridEl.innerHTML = "";

      const res = await fetch(
        `${API_BASE}/api/collection/${encodeURIComponent(userId)}?page=${page}&limit=${cardsPerPage}`
      );

      if (!res.ok) {
        statusEl.textContent = "User not found.";
        return;
      }

      const col = await res.json();
      const cards = col.cards || [];

      statusEl.textContent = `Page ${col.page} of ${col.total_pages} • Total cards: ${col.total}`;

      // Render cards
      for (const c of cards) {
        const name = c.name || c.card_id;
        const imgUrl = c.image_url || "";
        const rarity = c.rarity || "";

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="img">${imgUrl ? `<img src="${imgUrl}" alt="">` : "No image"}</div>
          <div class="name">${name}</div>
        `;

        div.addEventListener("click", () => {
          openModal({
            name,
            cardId: c.card_id,
            imgUrl,
            rarity
          });
        });

        gridEl.appendChild(div);
      }

      // Add pagination controls
      addPaginationControls(col.page, col.total_pages);
    }

    function addPaginationControls(current, totalPages) {
      const paginationDiv = document.createElement("div");
      paginationDiv.style.marginTop = "20px";
      paginationDiv.style.textAlign = "center";

      let html = "";

      if (current > 1) {
        html += `<button onclick="loadCollection(${current - 1})">← Previous</button> `;
      }

      html += ` Page ${current} of ${totalPages} `;

      if (current < totalPages) {
        html += `<button onclick="loadCollection(${current + 1})">Next →</button>`;
      }

      paginationDiv.innerHTML = html;
      gridEl.appendChild(paginationDiv);
    }
  </script>
</body>
</html>
